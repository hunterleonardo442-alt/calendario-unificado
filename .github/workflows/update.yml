name: Atualizar Calendario

on:
  workflow_dispatch:

  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:

  merge:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Gerar calendario
        run: |
          python merge.py

      - name: Commit arquivo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add calendario_unificado.ics

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao"
          else
            git commit -m "Atualizacao automatica"
            git push
          fi
